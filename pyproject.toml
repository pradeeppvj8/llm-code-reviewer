[project]
name = "llm-code-reviewer"
version = "0.1.0"
description = "AI Code Review CLI: feed it a git diff, get back structured review findings (file, line, severity, comment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "groq>=0.13",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_code_reviewer"]
